<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
	<defs>
		<radialGradient id="bgGradient" cx="75%" cy="20%" r="60%">
			<stop offset="0%" stop-color="#f1f5f9"/>
			<stop offset="45%" stop-color="#e2e8f0"/>
			<stop offset="100%" stop-color="#cbd5e1"/>
		</radialGradient>
		<linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
			<stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.03"/>
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="6" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>

	<rect width="1400" height="900" fill="url(#bgGradient)" />

	<g stroke="rgba(255, 255, 255, 0.45)" stroke-width="0.6" opacity="0.4">
		<path d="M 0,180 L 1400,180 M 0,360 L 1400,360 M 0,540 L 1400,540 M 0,720 L 1400,720" />
		<path d="M 250,0 L 250,900 M 550,0 L 550,900 M 850,0 L 850,900 M 1150,0 L 1150,900" />
	</g>

	<g stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="6 4" fill="none" opacity="0.55">
		<path d="M 580,500 L 800,240 L 1120,350 L 830,660 Z" />
		<path d="M 800,240 L 830,660 M 580,500 L 1120,350" />
	</g>

	<rect x="600" y="310" width="210" height="210" rx="16" transform="rotate(-12 600 310)" fill="url(#blueGlow)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow)"/>

	<g transform="translate(860, 220)" filter="url(#glow)">
		<rect width="310" height="370" rx="24" fill="rgba(255, 255, 255, 0.45)" stroke="rgba(255, 255, 255, 0.8)" stroke-width="1.5" />

		<rect x="45" y="55" width="55" height="42" rx="6" fill="none" stroke="#2563eb" stroke-width="3.5"/>
		<path d="M 56,55 L 56,38 A 16,16 0 0,1 89,38 L 89,55" fill="none" stroke="#2563eb" stroke-width="3.5"/>

		<line x1="45" y1="140" x2="265" y2="140" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
		<line x1="45" y1="175" x2="195" y2="175" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
		<line x1="45" y1="200" x2="230" y2="200" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
		<line x1="45" y1="225" x2="140" y2="225" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />

		<circle cx="240" cy="76" r="20" stroke="#10b981" stroke-width="3" fill="none" />
		<path d="M 231,76 L 237,82 L 250,68" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
	</g>

	<g fill="#3b82f6">
		<circle cx="580" cy="500" r="5" filter="url(#glow)"/>
		<circle cx="800" cy="240" r="5" filter="url(#glow)"/>
		<circle cx="1120" cy="350" r="7" fill="#2563eb" filter="url(#glow)"/>
		<circle cx="830" cy="660" r="5" filter="url(#glow)"/>
	</g>
</svg>
